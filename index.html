<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-truck.ico" sizes="any">
    <link rel="icon" href="/favicon-truck.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Выбранная тема до отрисовки, чтобы страница не мигала светлой (см. shared/lib/theme.ts)
      try {
        var theme = localStorage.getItem('wp.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <title>Взвешивание</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
